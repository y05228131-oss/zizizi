<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実験データ解析シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-4 font-sans">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-1">📊 実験データ解析シミュレーター</h1>
    <p class="text-center text-xs text-slate-500 mb-6">実験値を入力して、グラフの直線から質量比を突き止めよう！</p>
    
    <!-- 設定パネル -->
    <div class="mb-6 bg-slate-100 p-4 rounded-xl">
      <label class="block text-xs font-bold text-slate-600 mb-1">実験対象を選択</label>
      <select id="metalSelect" onchange="updateAll()" class="w-full p-2 rounded border border-slate-300 font-bold bg-white">
        <option value="copper">銅の加熱実験</option>
        <option value="magnesium">マグネシウムの加熱実験</option>
      </select>
    </div>

    <!-- 実験データ入力エリア -->
    <div class="mb-6 p-4 bg-emerald-50 rounded-xl border border-emerald-200">
      <h3 class="text-sm font-bold text-emerald-900 mb-2">🧪 測定値（実験データ）を入力</h3>
      <table class="w-full text-sm text-left text-slate-700 mb-3 bg-white rounded overflow-hidden shadow-sm">
        <thead class="bg-emerald-100 text-emerald-900">
          <tr>
            <th class="p-2">加熱前の金属の質量 (g) [横軸]</th>
            <th class="p-2">結びついた酸素の質量 (g) [縦軸]</th>
            <th class="p-2 w-20 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="expTableBody">
          <tr>
            <td class="p-2"><input type="number" class="exp-x w-full p-1 border rounded" value="1.2" step="0.1" onchange="updateAll()"></td>
            <td class="p-2"><input type="number" class="exp-y w-full p-1 border rounded" value="0.3" step="0.05" onchange="updateAll()"></td>
            <td class="p-2 text-center"><button onclick="deleteRow(this)" class="px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold">🗑️ 削除</button></td>
          </tr>
          <tr>
            <td class="p-2"><input type="number" class="exp-x w-full p-1 border rounded" value="2.4" step="0.1" onchange="updateAll()"></td>
            <td class="p-2"><input type="number" class="exp-y w-full p-1 border rounded" value="0.6" step="0.05" onchange="updateAll()"></td>
            <td class="p-2 text-center"><button onclick="deleteRow(this)" class="px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold">🗑️ 削除</button></td>
          </tr>
          <tr>
            <td class="p-2"><input type="number" class="exp-x w-full p-1 border rounded" value="3.6" step="0.1" onchange="updateAll()"></td>
            <td class="p-2"><input type="number" class="exp-y w-full p-1 border rounded" value="0.9" step="0.05" onchange="updateAll()"></td>
            <td class="p-2 text-center"><button onclick="deleteRow(this)" class="px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold">🗑️ 削除</button></td>
          </tr>
        </tbody>
      </table>
      <button onclick="addExpRow()" class="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-bold hover:bg-emerald-700">+ データ行を追加</button>
    </div>

    <!-- グラフ表示 -->
    <div class="relative w-full h-80 mb-4 bg-white p-2 rounded">
      <canvas id="mainChart"></canvas>
    </div>

    <!-- 画像保存ボタン -->
    <div class="text-right mb-6">
      <button onclick="downloadChartWithTitles()" class="px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded-lg shadow hover:bg-slate-700 transition flex items-center gap-2 ml-auto">
        <span>📸 軸タイトル付きでグラフを画像保存</span>
      </button>
    </div>

    <!-- 解析結果表示 -->
    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl">
      <h3 class="text-sm font-bold text-indigo-900 mb-2">📈 直線から求めた質量比の解析結果</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
        <div class="p-3 bg-white rounded-lg border border-indigo-100">
          <div class="text-xs text-slate-500 font-bold">直線の式 (傾向線)</div>
          <div id="lineEq" class="text-lg font-extrabold text-indigo-700">y = 0.25 x</div>
        </div>
        <div class="p-3 bg-white rounded-lg border border-indigo-100">
          <div class="text-xs text-slate-500 font-bold">金属 : 酸素 の質量比</div>
          <div id="massRatio" class="text-lg font-extrabold text-indigo-700">4.00 : 1</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let chart = null;

    function initChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [
            { label: '自動描画された直線', data: [], type: 'line', borderColor: '#4f46e5', borderWidth: 2, fill: false, pointRadius: 0 },
            { label: '実験データ（測定値）', data: [], backgroundColor: '#059669', pointRadius: 6, pointHoverRadius: 8 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top' }
          },
          scales: {
            x: { 
              title: { display: true, text: '加熱前の金属の質量 (g)', font: { weight: 'bold', size: 14 } }, 
              min: 0
            },
            y: { 
              title: { display: true, text: '結びついた酸素の質量 (g)', font: { weight: 'bold', size: 14 } }, 
              min: 0
            }
          }
        }
      });
      updateAll();
    }

    function addExpRow() {
      const tbody = document.getElementById('expTableBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="p-2"><input type="number" class="exp-x w-full p-1 border rounded" value="" step="0.1" onchange="updateAll()"></td>
        <td class="p-2"><input type="number" class="exp-y w-full p-1 border rounded" value="" step="0.05" onchange="updateAll()"></td>
        <td class="p-2 text-center"><button onclick="deleteRow(this)" class="px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold">🗑️ 削除</button></td>
      `;
      tbody.appendChild(tr);
    }

    function deleteRow(btn) {
      const row = btn.closest('tr');
      row.remove();
      updateAll();
    }

    // きりの良い上限値を求めるオートスケール用関数
    function getNiceMax(val, defaultVal) {
      if (!val || val <= 0) return defaultVal;
      const target = val * 1.25;
      const step = target > 5 ? 1 : (target > 1 ? 0.5 : 0.1);
      return Math.ceil(target / step) * step;
    }

    function updateAll() {
      const xs = document.querySelectorAll('.exp-x');
      const ys = document.querySelectorAll('.exp-y');
      const points = [];
      let sumX2 = 0, sumXY = 0;
      let maxX = 0, maxY = 0;

      xs.forEach((input, i) => {
        const x = parseFloat(input.value);
        const y = parseFloat(ys[i].value);
        if (!isNaN(x) && !isNaN(y) && x > 0) {
          points.push({x, y});
          sumX2 += x * x;
          sumXY += x * y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      });

      let slope = 0;
      if (sumX2 > 0) {
        slope = sumXY / sumX2;
      }

      // 入力された数値の最大値に合わせて軸の上限（スケール）を自動変動させる
      const limitX = getNiceMax(maxX, 5);
      const limitY = getNiceMax(maxY, 2);

      chart.options.scales.x.max = limitX;
      chart.options.scales.y.max = limitY;

      chart.data.datasets[0].data = [{x: 0, y: 0}, {x: limitX, y: limitX * slope}];
      chart.data.datasets[1].data = points;
      chart.update();

      if (slope > 0) {
        document.getElementById('lineEq').innerText = `y = ${slope.toFixed(2)} x`;
        const ratioMetal = (1 / slope).toFixed(2);
        document.getElementById('massRatio').innerText = `${ratioMetal} : 1`;
      } else {
        document.getElementById('lineEq').innerText = 'データ入力待ち';
        document.getElementById('massRatio').innerText = '-';
      }
    }

    function downloadChartWithTitles() {
      const metalText = document.getElementById('metalSelect').options[document.getElementById('metalSelect').selectedIndex].text;
      const ratioText = document.getElementById('massRatio').innerText;
      const lineText = document.getElementById('lineEq').innerText;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      const origCanvas = document.getElementById('mainChart');

      const paddingHeader = 70;
      const paddingFooter = 40;
      tempCanvas.width = origCanvas.width;
      tempCanvas.height = origCanvas.height + paddingHeader + paddingFooter;

      tempCtx.fillStyle = '#ffffff';
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      tempCtx.fillStyle = '#1e293b';
      tempCtx.font = 'bold 18px sans-serif';
      tempCtx.textAlign = 'center';
      tempCtx.fillText(`【実験分析】${metalText}`, tempCanvas.width / 2, 30);

      tempCtx.fillStyle = '#4f46e5';
      tempCtx.font = 'bold 14px sans-serif';
      tempCtx.fillText(`傾向線: ${lineText}  |  質量比 (金属 : 酸素) = ${ratioText}`, tempCanvas.width / 2, 52);

      tempCtx.drawImage(origCanvas, 0, paddingHeader);

      const link = document.createElement('a');
      link.download = `${metalText}_グラフ解析結果.png`;
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }

    window.onload = initChart;
  </script>
</body>
</html>
